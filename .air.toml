root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/redis-server ./cmd/main.go"
  entrypoint = "./tmp/redis-server"
  include_ext = ["go"]
  exclude_dir = ["bin", "tmp", ".git", ".gocache"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true

[misc]
  clean_on_exit = true
